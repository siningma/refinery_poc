[package]
name = "refinery_poc"
version = "0.1.0"
edition = "2021"

[dependencies]
refinery = { version = "0.9.2", features = ["postgres"] }
postgres = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
